<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2D0F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghar Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root{
  --plum:#2D0F3A;--purple:#5B2A86;--purple2:#8A5CB8;--lav:#F1E8F8;
  --magenta:#B0265E;--magenta2:#D9578A;--pink:#FBE6EF;
  --cream:#FFF8EF;--cream2:#F5E9DA;--card:#FFFFFF;--gold:#C9974A;--gold2:#F3E2C4;
  --text:#2A1433;--muted:#8B7894;--line:#ECDFE7;
  --ok:#2E8B57;--okbg:#E4F4EA;--warn:#B8740A;--warnbg:#FFF1D6;--bad:#C62828;--badbg:#FDE3E3;
  --r:16px;--shadow:0 4px 18px rgba(45,15,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream)}
body{font-family:Poppins,system-ui,sans-serif;color:var(--text);font-size:14px;padding-bottom:24px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
.wrap{max-width:720px;margin:0 auto}

/* sticky top: header + main tabs + subtabs */
.stick{position:sticky;top:0;z-index:20;box-shadow:0 6px 18px rgba(45,15,58,.10)}
.topbar{background:linear-gradient(135deg,var(--plum) 0%,var(--purple) 70%,var(--magenta) 130%);color:#fff;padding:12px 16px 12px}
header.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;font-size:20px;letter-spacing:.3px}
.brand span{color:var(--gold2)}
.hsub{font-size:12px;opacity:.85}
.hact{display:flex;gap:8px;align-items:center}
.mode{font-size:11px;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.16)}
.icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px}

/* main tabs (upar) */
.maintabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;background:rgba(255,255,255,.10);padding:4px;border-radius:14px}
.maintabs button{padding:9px 4px;border-radius:11px;font-weight:600;font-size:13.5px;color:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;gap:6px}
.maintabs button b{font-size:17px;font-weight:400}
.maintabs button.on{background:var(--cream);color:var(--plum);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.maintabs button.on::after{content:"";display:none}

/* subtabs */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--cream2);scrollbar-width:none;border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.st{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;color:var(--purple);background:#fff;border:1px solid var(--line)}
.st.on{background:var(--magenta);color:#fff;border-color:var(--magenta)}

main{padding:14px 16px}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:15px;color:var(--plum);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title{font-size:15px;font-weight:600;color:var(--plum);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{border-radius:var(--r);padding:12px;color:#fff;position:relative;overflow:hidden;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.acc::after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.acc .bk{font-weight:600;font-size:13px}
.acc .lb{font-size:11px;opacity:.85}
.acc .bl{font-size:19px;font-weight:700;margin-top:6px}
.acc .ow{position:absolute;right:10px;bottom:10px;font-size:10px;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:10px}
.acc.pool{grid-column:1/-1;min-height:92px}
.stat{background:var(--cream);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat .v{font-weight:700;font-size:16px;color:var(--plum)}
.stat .k{font-size:11px;color:var(--muted)}
.stat.m .v{color:var(--magenta)} .stat.p .v{color:var(--purple)} .stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)}

/* buttons */
.btn{background:linear-gradient(120deg,var(--purple),var(--magenta));box-shadow:0 4px 12px rgba(176,38,94,.22);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;width:100%;font-size:15px;margin-top:12px}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;margin-top:0;border-radius:10px}
.btn.ghost{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
.btn.cream{background:var(--cream2);color:var(--plum)}
.btn.danger{background:var(--bad)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:11px;font-weight:500;color:var(--plum);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.qa button b{font-size:22px;font-weight:400}
.row{display:flex;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.mini{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--lav);color:var(--purple);font-weight:500}
.mini.del{background:var(--badbg);color:var(--bad)}
.mini.ok{background:var(--okbg);color:var(--ok)}

/* month nav */
.mnav{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:6px;margin-bottom:12px;border:1px solid var(--line)}
.mnav button{width:38px;height:34px;border-radius:10px;background:var(--lav);color:var(--purple);font-size:20px;font-weight:600}
.mnav b{color:var(--plum);font-size:14px;text-align:center}
.seg{display:flex;background:var(--cream2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--magenta);box-shadow:var(--shadow)}

/* list */
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:none}
.tx .ic{width:40px;height:40px;border-radius:12px;background:var(--lav);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;overflow:hidden}
.tx .ic img{width:100%;height:100%;object-fit:cover}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:11.5px;color:var(--muted)}
.tx .amt{font-weight:600;text-align:right;white-space:nowrap}
.tx .amt.neg{color:var(--magenta)} .tx .amt.pos{color:var(--ok)} .tx .amt.neu{color:var(--purple)}
.tx .acts{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600;margin-left:4px;vertical-align:middle}
.pill.imp{background:var(--pink);color:var(--magenta)}
.pill.unwanted{background:var(--badbg);color:var(--bad)}
.pill.normal{background:var(--lav);color:var(--purple)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:13px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.filters select{padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px}
.bar{height:10px;border-radius:10px;background:var(--cream2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* modal */
.ov{position:fixed;inset:0;background:rgba(43,19,48,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .2s}
.sheet h3{color:var(--plum);font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sheet label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--purple2)}
.sheet .x{width:32px;height:32px;border-radius:50%;background:var(--cream2);font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip.on{border-color:var(--purple);background:var(--purple);color:#fff}
.chip.imp.on{background:var(--magenta);border-color:var(--magenta)}
.chip.unwanted.on{background:var(--bad);border-color:var(--bad)}
.photo{border:2px dashed var(--purple2);border-radius:14px;background:#fff;padding:14px;text-align:center;color:var(--purple);font-weight:500;display:block;position:relative;cursor:pointer}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo img{max-width:100%;max-height:180px;border-radius:10px;display:block;margin:0 auto}
.ocr{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--lav);color:var(--purple);font-size:12.5px}
.ocr.good{background:var(--okbg);color:var(--ok)} .ocr.bad{background:var(--warnbg);color:var(--warn)}
.items{margin-top:8px;background:#fff;border-radius:12px;border:1px solid var(--line);padding:8px 10px;font-size:12.5px}
.items .g{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.items .g:last-child{border-bottom:none}
.ck{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px}
.ck input{width:auto}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days label{margin:0;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);padding:6px 9px;border-radius:10px;color:var(--text);font-size:12.5px}
.days input{width:auto}

/* calendar */
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calh{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:3px}
.cal{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--plum)}
.cal small{font-size:9.5px;font-weight:500;line-height:1}
.cal.P{background:var(--okbg);border-color:#9fd3b2;color:var(--ok)}
.cal.A{background:var(--badbg);border-color:#f2a9a9;color:var(--bad)}
.cal.H{background:var(--warnbg);border-color:#f0c97a;color:var(--warn)}
.cal.off{background:var(--cream2);color:var(--muted)}
.cal.today{outline:2.5px solid var(--magenta);outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:middle}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
.brk .l{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.brk .l.tot{border-bottom:none;font-weight:700;font-size:16px;color:var(--plum);padding-top:10px}
.chartbox{position:relative;height:230px}
.chartbox.sm{height:200px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:linear-gradient(160deg,var(--plum),var(--purple) 55%,var(--magenta))}
.login h1{color:#fff;font-size:30px;font-weight:700}
.login p{color:#f6dcef;margin-bottom:24px;text-align:center}
.who{display:flex;gap:14px;margin-bottom:20px}
.who button{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:18px;padding:16px 22px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;min-width:118px}
.who button b{font-size:34px;font-weight:400}
.who button.on{background:var(--cream);color:var(--plum);border-color:var(--cream)}
.pin{display:flex;gap:10px;margin-bottom:14px}
.pin input{width:52px;height:58px;border-radius:14px;border:none;text-align:center;font-size:24px;font-weight:700;background:var(--cream);color:var(--plum)}
.login .btn{max-width:260px}
.login .note{font-size:11.5px;color:#f1cfe6;margin-top:16px;text-align:center;max-width:300px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:13px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.viewer img{width:100%;border-radius:12px}
</style>
</head>

<script>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => { const v = Number(n || 0); return (v < 0 ? '−₹' : '₹') + Math.abs(v).toLocaleString('en-IN', {maximumFractionDigits: 2}); };
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => toISO(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const fmtD = s => s ? parseD(s).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '—';
const fmtDs = s => s ? parseD(s).toLocaleDateString('en-IN', {day:'numeric', month:'short'}) : '—';
const ymOf = s => (s || '').slice(0, 7);
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'}); };
const shiftYM = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const daysInYM = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const sum = (arr, k = 'amount') => arr.reduce((a, b) => a + Number(b[k] || 0), 0);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

/* ---------- constants ---------- */

const CATEGORIES = [
  ['Groceries','🛒',1],['Kapde / Clothes','👗',0],['Footwear','👟',0],['Ghar ka Saaman','🏠',1],['Personal Care','🧴',0],

  ['Food & Dining','🍽️',0],['Transport','🚕',0],['SSSN / Cats','🐈',0],['Art Supplies','🎨',0],

const catIcon = id => (CATEGORIES.find(c => c.id === id) || {icon:'📦'}).icon;

/* Shopping types — order matters (pehle specific, phir general) */

/* ---------- data store (Firebase or Local) ---------- */
const COLS = ['accounts','txns','goals','maids','attendance','extras','salaries','cylinders','services','serviceLogs','ironing','ironPays','carPays','fees','loans','investments','pdPays','pdExtras','bills','meta'];
const DB = {}; COLS.forEach(c => DB[c] = []);
let fs = null;
const clean = o => JSON.parse(JSON.stringify(o));
const Store = {
  mode: 'local',
  init() {
    return new Promise(resolve => {
      if (FIREBASE_CONFIG && window.firebase) {
        try {
          firebase.initializeApp(FIREBASE_CONFIG);
          fs = firebase.firestore();
          try { fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); } catch(e) {}
          this.mode = 'cloud';
          let loaded = 0;
          COLS.forEach(c => {
            let first = true;
            fs.collection('gk_' + c).onSnapshot(snap => {
              DB[c] = snap.docs.map(d => ({...d.data(), id: d.id}));
              if (first) { first = false; if (++loaded === COLS.length) resolve(); }
              scheduleRender();
            }, err => { console.error(err); if (first) { first = false; if (++loaded === COLS.length) resolve(); } });
          });
          return;
        } catch (e) { console.error('Firebase init fail', e); this.mode = 'local'; }
      }
      try { const raw = localStorage.getItem('gk_data'); if (raw) { const d = JSON.parse(raw); COLS.forEach(c => DB[c] = d[c] || []); } } catch (e) {}
      resolve();
    });
  },
  persist() { if (this.mode === 'local') { try { localStorage.setItem('gk_data', JSON.stringify(DB)); } catch (e) { toast('Phone storage full! Firebase connect karo.'); } } },
  get(col, id) { return DB[col].find(x => x.id === id); },
  async add(col, obj, id) {
    obj = {...obj}; obj.id = id || obj.id || uid(); obj.createdAt = obj.createdAt || Date.now(); obj.by = obj.by || USER;
    if (this.mode === 'cloud') { const {id: _i, ...data} = obj; await fs.collection('gk_' + col).doc(obj.id).set(clean(data)); }
    else { DB[col].push(obj); this.persist(); scheduleRender(); }
    return obj.id;
  },
  async update(col, id, patch) { // upsert
    patch = {...patch, updatedAt: Date.now()};
    if (this.mode === 'cloud') { await fs.collection('gk_' + col).doc(id).set(clean(patch), {merge:true}); }
    else { const x = this.get(col, id); if (x) Object.assign(x, patch); else DB[col].push({...patch, id, createdAt: Date.now(), by: USER}); this.persist(); scheduleRender(); }
  },
  async remove(col, id) {
    if (this.mode === 'cloud') { await fs.collection('gk_' + col).doc(id).delete(); }
    else { DB[col] = DB[col].filter(x => x.id !== id); this.persist(); scheduleRender(); }
  }
};
const settings = () => Store.get('meta', 'settings') || {};

async function seed() {
  if ((settings().accOrderV || 0) < 2 && DB.accounts.length) { // bank priority: HDFC, ICICI, BoM, Central, Union
    const ord = {hdfc:1, icici:2, bom:3, cbi:4, ubi:5, cash:6};
    for (const a of DB.accounts) if (ord[a.id] && a.order !== ord[a.id]) await Store.update('accounts', a.id, {order: ord[a.id]});
    await Store.update('meta', 'settings', {accOrderV: 2});
  }
  for (const a of DEFAULT_ACCOUNTS) if (!Store.get('accounts', a.id)) await Store.add('accounts', {...a}, a.id);
  for (const s of DEFAULT_SERVICES) if (!Store.get('services', s.id)) await Store.add('services', {...s}, s.id);
}

function effects(t) {
  const a = num(t.amount);
  switch (t.type) {
    case 'expense': return [{acc: t.account, amt: -a}];
    case 'income': return [{acc: t.account, amt: a}];
    case 'contribution':
      if (!t.from || t.from === 'outside' || t.from === t.to) return [{acc: t.to, amt: a}];
      return [{acc: t.from, amt: -a}, {acc: t.to, amt: a}];
    case 'saving': return [{acc: t.account, amt: t.mode === 'withdraw' ? a : -a}];
    case 'settle': return [{acc: t.from, amt: -a}, {acc: t.to, amt: a}];
  }
  return [];
}
function balances() {
  const m = {}; DB.accounts.forEach(a => m[a.id] = num(a.opening));
  DB.txns.forEach(t => effects(t).forEach(e => { if (e.acc in m) m[e.acc] += e.amt; }));
  return m;
}

/* ---------- transaction row ---------- */
function txnRow(t, opts = {}) {
  const typeIc = {income:'💵', contribution:'🤝', saving:'🐷', settle:'⚖️'};
  const ic = t.photo ? `<img src="${t.photo}" onclick="event.stopPropagation();viewPhoto('txns','${t.id}')">` : ((t.type === 'expense' || t.type === 'pending') ? catIcon(t.category) : typeIc[t.type]);
  let title, sub, cls, sign;
  if (t.type === 'expense' || t.type === 'pending') { title = t.note || t.category; sub = `${t.category}${t.loanName ? ' · ' + esc(t.loanName) : ''} · ${accName(t.account)}`; cls = t.type === 'pending' ? 'neu' : 'neg'; sign = t.type === 'pending' ? '' : '−'; }
  else if (t.type === 'settle') { title = `${USERS[t.payer]?.name} → ${USERS[t.payee]?.name} · ghar kharcha ka hissa`; sub = `${accName(t.from)} → ${accName(t.to)}${t.note ? ' · ' + esc(t.note) : ''}`; cls = 'neu'; sign = ''; }
  else if (t.type === 'income') { title = t.note || 'Income'; sub = `Aaya → ${accName(t.account)}`; cls = 'pos'; sign = '+'; }
  else if (t.type === 'contribution') { title = `${USERS[t.person]?.name || ''} ka contribution`; sub = `${t.from && t.from !== 'outside' && t.from !== t.to ? accName(t.from) + ' → ' : ''}${accName(t.to)}${t.note ? ' · ' + esc(t.note) : ''}`; cls = 'neu'; sign = ''; }
  else if (t.type === 'saving') { const g = Store.get('goals', t.goal), iv = t.investId && Store.get('investments', t.investId); title = iv ? `${t.mode === 'withdraw' ? 'Maturity' : INV_KIND[iv.kind].icon + ' ' + INV_KIND[iv.kind].short} · ${iv.name}` : `${t.mode === 'withdraw' ? 'Nikala' : 'Saving'} · ${g ? g.name : 'General Savings'}`; sub = accName(t.account); cls = t.mode === 'withdraw' ? 'pos' : 'neu'; sign = t.mode === 'withdraw' ? '+' : '−'; }
  const tag = (t.type === 'pending' ? '<span class="pill warn">Baaki</span>' : '') + (t.gharSplit ? '<span class="pill normal">🏠 Ghar · aadha</span>' : '') + ((t.type === 'expense' || t.type === 'pending') && t.tag ? `<span class="pill ${t.tag}">${(PRIORITY.find(p => p.id === t.tag) || {}).short || ''}</span>` : '');
  const payBtn = t.type === 'pending' && !opts.noActs ? `<button class="mini ok" onclick="openMarkPaid('${t.id}')">💸 Paid</button>` : '';
  const acts = (canEdit() || payBtn) && !opts.noActs ? `<div class="acts">${payBtn}${canEdit() ? `<button class="mini" onclick="editTxn('${t.id}')">Edit</button><button class="mini del" onclick="delTxn('${t.id}')">Del</button>` : ''}</div>` : '';
  return `<div class="tx"><div class="ic">${ic}</div><div class="mid"><div class="t1">${esc(title)}${tag}</div><div class="t2">${fmtDs(t.date)}${t.time ? ' · ' + t.time : ''} · ${esc(sub)} · ${USERS[t.by]?.name || ''}</div></div>
  <div><div class="amt ${cls}">${sign}${inr(t.amount)}</div>${acts}</div></div>`;
}
function editTxn(id) {
  const t = Store.get('txns', id); if (!t) return;
  if (t.type === 'settle') return toast('Hisaab entry edit nahi hoti — delete karke dobara karo');
  if (t.type === 'expense' || t.type === 'pending') { if (t.source === 'travel') openTravel(id); else if (t.source === 'kid') openKid(id); else openExpense({id}); } else if (t.type === 'income') openIncome(id); else if (t.type === 'contribution') openContrib(id); else if (t.type === 'saving') openSaving(id);
}
function delTxn(id) {
  if (!canEdit()) return;
  const t = Store.get('txns', id); if (!t) return;
  confirmDo(`${inr(t.amount)} wali entry delete karein?`, async () => {
    await Store.remove('txns', id);
    if (t.link) {
      if (t.link.col === 'salaries') await Store.remove('salaries', t.link.id);
      else if (t.link.col === 'ironPays') await unlinkIronPay(t.link.id);
      else if (t.link.col === 'carPays') await Store.remove('carPays', t.link.id);
      else if (t.link.col === 'pdPays') await unlinkPdPay(t.link.id);
      else if (t.link.col === 'pdExtras' && Store.get('pdExtras', t.link.id)) await Store.update('pdExtras', t.link.id, {paid: false, txnId: null});
      else if (Store.get(t.link.col, t.link.id)) await Store.update(t.link.col, t.link.id, {txnId: null});
    }
    toast('Delete ho gaya');
  });
}

const isHouseCat = c => !!(CATEGORIES.find(x => x.id === c) || {}).h;
const personOf = accId => { const o = accOf(accId).owner; return o === 'minal' || o === 'piyush' ? o : null; };
const otherP = p => p === 'minal' ? 'piyush' : 'minal';
const shareOf = p => { const m = num(settings().split ?? 50); return p === 'minal' ? m : 100 - m; };
const DUE_DAYS = 3;
const homeAcc = p => p === 'minal' ? 'bom' : 'icici';
function gharDues() {
  return DB.txns.filter(t => t.type === 'expense' && t.gharSplit && personOf(t.account)).map(t => {
    const creditor = personOf(t.account), debtor = otherP(creditor);
    const amount = Math.round(num(t.amount) * shareOf(debtor) / 100);
    const dueBy = addDays(t.date, DUE_DAYS);
    const settle = DB.txns.find(x => x.type === 'settle' && x.dueOf === t.id) || null;
    return {t, creditor, debtor, amount, dueBy, toAcc: t.account, settle, late: !settle && today() > dueBy, left: diffDays(today(), dueBy)};
  }).filter(d => d.amount > 0).sort((a, b) => (!!a.settle - !!b.settle) || a.dueBy.localeCompare(b.dueBy));
}
function gharCalc() { const open = gharDues().filter(d => !d.settle); const tot = p => open.filter(d => d.debtor === p).reduce((a, d) => a + d.amount, 0); return {open, piyush: tot('piyush'), minal: tot('minal'), owe: tot('piyush') - tot('minal')}; }
function dueRow(d, compact) {
  const mine = d.debtor === USER;
  const st = d.settle ? `<span class="pill ok">✔ Transfer ho gaya ${fmtDs(d.settle.date)}</span>` : d.late ? `<span class="pill bad">OVERDUE · ${fmtDs(d.dueBy)} tak tha</span>` : `<span class="pill warn">${d.left <= 0 ? 'Aaj tak' : d.left + ' din me'} · ${fmtDs(d.dueBy)}</span>`;
  return `<div class="tx" style="${!d.settle && mine ? 'background:var(--pink);border-radius:10px;padding:8px' : ''}"><div class="ic">${catIcon(d.t.category)}</div>
    <div class="mid"><div class="t1" style="white-space:normal">${USERS[d.debtor].emoji} ${USERS[d.debtor].name} → ${USERS[d.creditor].name} ke <b>${accName(d.toAcc)}</b> me <b>${inr(d.amount)}</b></div>
    <div class="t2">${esc(d.t.note || d.t.category)} · ${USERS[d.creditor].name} ne ${accName(d.t.account)} se ${inr(d.t.amount)} · ${fmtDs(d.t.date)}</div><div style="margin-top:3px">${st}</div></div>
    ${!d.settle && !compact ? `<button class="btn sm" style="flex-shrink:0" onclick="openSettle('${d.t.id}')">✔ Transfer kiya</button>` : ''}
    ${d.settle && canEdit() && !compact ? `<button class="mini del" onclick="undoSettle('${d.settle.id}')">↺</button>` : ''}</div>`;
}
function duesBanner() {
  const open = gharDues().filter(d => !d.settle); if (!open.length) return '';

  const msg = [mine.length ? `Aapko ${o} ko ${inr(mine.reduce((a, d) => a + d.amount, 0))} dene hain` : '', theirs.length ? `${o} se ${inr(theirs.reduce((a, d) => a + d.amount, 0))} aane hain` : ''].filter(Boolean).join(' · ');

let GP = {date: '', rows: []};
const MON = {jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12};
const GP_CAT = [
  ['Food & Dining', ['swiggy','zomato','restaurant','cafe','hotel','pizza','dominos','kfc','mcdonald','burger','biryani','chai','tea stall','bakery','sweets']],
  ['Transport', ['uber','ola','rapido','irctc','metro','petrol','fuel','hpcl','bpcl','indian oil','fastag','parking','auto','taxi','railway']],
  ['Bills & Utilities', ['jio','airtel','vodafone','vi prepaid','electricity','adani','best','mahavitaran','broadband','recharge','dth','tata play','gas bill','mahanagar gas']],
  ['Medical', ['pharmacy','medical','chemist','apollo','medplus','hospital','clinic','diagnostic','netmeds','1mg','pharmeasy','doctor']],
  ['Groceries', ['blinkit','zepto','instamart','bigbasket','dmart','d mart','reliance fresh','smart bazaar','kirana','grocery','provision','general store','vegetable','sabzi','dairy','milk']],
  ['Other Shopping', ['amazon','flipkart','myntra','ajio','meesho','nykaa','croma','decathlon']],
  ['SSSN / Cats', ['vet','pet','whiskas','royal canin','drools']],
  ['Kids & School', ['school','day care','daycare','tuition','firstcry']]
];
function gpGuessCat(name) { const n = name.toLowerCase(); for (const [c, kws] of GP_CAT) if (kws.some(w => n.includes(w))) return c; const st = storeType(n); return st || 'Other'; }
function gpFindDate(l) {
  const m = l.match(/(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s*(\d{4})?/i);
  if (m) { const y = m[3] ? +m[3] : +(GP.date || today()).slice(0, 4); return `${y}-${pad(MON[m[2].toLowerCase()])}-${pad(+m[1])}`; }
  if (/\btoday\b/i.test(l)) return today();
  if (/\byesterday\b/i.test(l)) return addDays(today(), -1);
  return null;
}
function parseGpay(text, defDate) {
  const lines = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const amtRe = /([+\-–])?\s*(?:₹|rs\.?|inr|%|=|z|x)\s*(\d[\d,]*(?:\.\d{1,2})?)\s*$/i;
  const bareRe = /^([+\-–])?\s*(\d{1,3}(?:,\d{2,3})*(?:\.\d{1,2})?|\d{1,6}(?:\.\d{1,2})?)$/;
  const statusRe = /^(paid|received|sent|completed|pending|debited|credited|successful|success|today|yesterday|upi|via)\b/i;
  const clean = n => n.replace(/^(paid to|sent to|received from|payment to|payment from|to|from|paid|received)\s*:?\s*/i, '').replace(/(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*.*$/i, '').replace(/[^a-zA-Z0-9 &.'-]/g, ' ').replace(/\s+/g, ' ').trim();
  const out = [];
  lines.forEach((l, i) => {
    let m = l.match(amtRe), sign = '', amt = null, before = '';
    if (m) { sign = m[1] || ''; amt = parseFloat(m[2].replace(/,/g, '')); before = l.slice(0, m.index); }
    else if ((m = l.match(bareRe))) { const v = parseFloat(m[2].replace(/,/g, '')); if (v >= 2020 && v <= 2035 && !m[2].includes(',')) return; sign = m[1] || ''; amt = v; }
    if (!amt || amt <= 0 || amt > 500000) return;
    if (/failed|declined|cancelled|reversed/i.test((lines[i - 1] || '') + ' ' + l)) return;
    if (/balance|available/i.test(l)) return;
    let name = /[a-zA-Z]{3,}/.test(before) ? clean(before) : '';
    for (let k = i - 1; !name && k >= Math.max(0, i - 3); k--) { const c = lines[k], cc = clean(c); if (/[a-zA-Z]{3,}/.test(cc) && !statusRe.test(cc) && !(gpFindDate(c) && c.replace(/[^a-zA-Z]/g, '').length < 12) && !amtRe.test(c)) name = cc; }
    if (!name) name = 'GPay payment';
    const near = [lines[i - 1], lines[i - 2]].filter(Boolean).join(' ');
    const dir = sign === '+' || /received|credited|refund|cashback|\bfrom\b/i.test(before + ' ' + near) ? 'in' : 'out';
    let date = gpFindDate(l) || gpFindDate(lines[i + 1] || '') || gpFindDate(lines[i - 1] || '') || gpFindDate(lines[i + 2] || '') || defDate;
    out.push({name: name.slice(0, 40), amount: amt, dir, date});
  });
  return out;
}
function gpInKind(r, lr) {
  const n = r.name.toLowerCase();
  r.person = /piyush/.test(n) ? 'piyush' : /minal|gayatri/.test(n) ? 'minal' : (USER === 'piyush' ? 'minal' : 'piyush');
  r.inKind = lr?.kind || (/piyush|minal|bahad/.test(n) ? 'contribution' : 'income');
  if (r.inKind === 'contribution' && !lr?.acc) r.acc = 'hdfc';
}
function gpLearn(name) {
  const n = name.toLowerCase();
  const prev = [...DB.txns].filter(t => t.gpayName && t.gpayName.toLowerCase() === n).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
  return prev ? {cat: prev.category, acc: prev.account || prev.to, kind: prev.type === 'contribution' ? 'contribution' : prev.type === 'income' ? 'income' : null} : null;
}
/* duplicate warning for manual entries */
let DUP_OK = false;
function findDupTxn(amount, date) {
  return DB.txns.find(t => (t.type === 'expense' || t.type === 'pending') && Math.abs(num(t.amount) - amount) < 0.5 && Math.abs(diffDays(t.date, date)) <= 1);
}
function dupGuard(amount, date, call) {
  if (DUP_OK) { DUP_OK = false; return false; }
  const d = findDupTxn(amount, date); if (!d) return false;
  const box = document.createElement('div'); box.id = 'dupWarn';
  box.className = 'card'; box.style.cssText = 'margin-top:12px;background:var(--warnbg);border-color:#f0c97a';
  box.innerHTML = `<b style="color:var(--warn)">⚠️ Ye entry shayad pehle se hai</b>
    <div class="muted" style="margin:4px 0 8px">${USERS[d.by]?.name || ''} ne daali · ${inr(d.amount)} · ${esc(d.note || d.category)} · ${fmtDs(d.date)} · ${accName(d.account)}${d.type === 'pending' ? ' · Baaki' : ''}</div>
    <div class="row"><button class="btn sm" onclick="DUP_OK=true;${call.replace(/"/g, '&quot;')}">Phir bhi save karo (double order)</button><button class="btn sm cream" onclick="closeModal()">Cancel</button></div>`;
  const old = document.getElementById('dupWarn'); if (old) old.remove();
  document.querySelector('.sheet').appendChild(box); box.scrollIntoView({behavior:'smooth', block:'center'});
  return true;
}
function gpFindDup(r, used) {
  return DB.txns.find(t => !(used && used.has(t.id)) && (r.dir === 'out' ? ['expense', 'pending', 'contribution', 'saving'].includes(t.type) : ['income', 'contribution'].includes(t.type))
    && Math.abs(num(t.amount) - r.amount) < 0.5 && Math.abs(diffDays(t.date, r.date)) <= 1);
}
function gpCheckDups() { const used = new Set(); GP.rows.forEach(r => { if ((r.status === 'new' || r.status === 'dup') && !r.forced) { const d = gpFindDup(r, used); if (d) used.add(d.id); r.status = d ? 'dup' : 'new'; r.dupOf = d ? d.id : null; } }); }
function openGpay() {
  GP = {date: today(), rows: []};
  modal(mHead('📲 GPay history se entries') + `
    <div class="muted">GPay kholo → apni photo → Transaction history. Uska screenshot lo — ek se zyada bhi chalega.</div>
    <label>Kis din ki history</label><input id="gpDate" type="date" value="${GP.date}" onchange="GP.date=this.value;GP.rows.forEach(r=>{if(r.autoDate)r.date=this.value});gpCheckDups();renderGP()">
    <label class="photo" style="margin-top:10px"><input type="file" accept="image/*" multiple onchange="gpFiles(this)">📲 Screenshot upload karo<br><span class="muted">Duplicate apne aap hat jayenge</span></label>
    <div id="gpStat"></div><div id="gpBox"></div>`);
}
async function gpFiles(inp) {
  const files = [...inp.files]; if (!files.length) return;
  const st = $('#gpStat');
  try {
    st.innerHTML = '<div class="ocr">🔍 OCR load ho raha hai…</div>';
    await loadTesseract();
    let added = 0, skipped = 0;
    for (let f = 0; f < files.length; f++) {
      st.innerHTML = `<div class="ocr">🔍 Screenshot ${f + 1}/${files.length} padh rahe hain… <b id="gpP">0%</b></div>`;
      const img = await fileToImg(files[f]);
      const {data} = await Tesseract.recognize(imgToData(img, 1800, 0.92, true), 'eng', {logger: m => { if (m.status === 'recognizing text') { const p = $('#gpP'); if (p) p.textContent = Math.round(m.progress * 100) + '%'; } }});
      const local = {};
      for (const e of parseGpay(data.text || '', GP.date)) {
        const key = `${e.dir}|${e.amount}|${e.date}|${e.name.toLowerCase().slice(0, 8)}`;
        local[key] = (local[key] || 0) + 1;  // same screenshot me 2 baar = asli double order
        if (GP.rows.filter(r => r.key === key).length >= local[key]) { skipped++; continue; }
        const lr = gpLearn(e.name);
        const row = {...e, key, id: uid(), autoDate: e.date === GP.date, status: 'new', cat: lr?.cat || gpGuessCat(e.name), acc: lr?.acc || (USER === 'piyush' ? 'icici' : 'bom')};
        if (row.dir === 'in') gpInKind(row, lr);
        GP.rows.push(row);
        added++;
      }
    }
    gpCheckDups();
    const nw = GP.rows.filter(r => r.status === 'new').length, dp = GP.rows.filter(r => r.status === 'dup').length;
    st.innerHTML = GP.rows.length ? `<div class="ocr good">✅ ${GP.rows.length} entries mili · ${nw} nayi · ${dp} pehle se app me hain${skipped ? ' · ' + skipped + ' screenshot me do baar thi' : ''}<br><span style="opacity:.8">Naam / amount check kar lo, galat ho to badal do</span></div>` : '<div class="ocr bad">Screenshot se entries nahi padh paaye. Saaf, zoom kiya hua screenshot try karo.</div>';
  } catch (e) { console.error(e); st.innerHTML = '<div class="ocr bad">Screenshot padhne me dikkat aayi — internet check karke dobara try karo.</div>'; }
  inp.value = '';
  renderGP();
}

function renderGP() {

    ${GP.rows.length && !nw.length && !dup.length && !done.length ? '<div class="empty">Sab entries hata di gayi</div>' : ''}`;

function gpSetKind(id, v) {
  const r = GP.rows.find(x => x.id === id); if (!r) return;

}
function gpSet(id, k, v) {
  const r = GP.rows.find(x => x.id === id); if (!r) return;
  if (k === 'status' && v === 'force') { r.status = 'new'; r.forced = true; renderGP(); return; }
  r[k] = v; if (k === 'date') r.autoDate = false; if (k === 'acc') r.accTouched = true;
  if (k === 'status') renderGP();

async function gpPay(id, quiet) {
  const r = GP.rows.find(x => x.id === id); if (!r || r.status !== 'new') return;

  if (r.dir === 'in' && r.inKind === 'contribution') { const {account, source, ...rest} = base; await Store.add('txns', {...rest, source: 'gpay', type: 'contribution', person: r.person || 'piyush', from: 'outside', to: r.acc, note: 'GPay se'}); }
  else if (r.dir === 'in') await Store.add('txns', {...base, type: 'income', note: `${r.name} (GPay)`});

  r.status = 'done';
  if (!quiet) { renderGP(); toast(`${inr(r.amount)} ${accName(r.acc)} ${r.dir === 'in' ? (r.inKind === 'contribution' ? 'me contribution jama' : 'me jama') : 'se minus'} ✔`); }
}
async function gpPayPending(id) {

  await Store.update('txns', t.id, {type:'expense', account: r.acc, entryDate: t.entryDate || t.date, date: r.date, time: nowTime(), paidBy: USER, gpayName: r.name});

/* OCR */
function loadTesseract() {
  return new Promise((res, rej) => {
    if (window.Tesseract) return res();
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res; s.onerror = () => rej(new Error('OCR load fail')); document.head.appendChild(s);
  });
}
function fileToImg(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); }); }
function imgToData(img, max, q, gray) {
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  const x = c.getContext('2d'); if (gray) x.filter = 'grayscale(1) contrast(1.5)';
  x.drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
}
async function onPhoto(inp) {
  const f = inp.files[0]; if (!f) return;
  const st = $('#ocrStat');
  try {
    const img = await fileToImg(f);
    DRAFT.photo = imgToData(img, 560, 0.6);
    $('#phPrev').innerHTML = `<img src="${DRAFT.photo}">`;
    st.innerHTML = '<div class="ocr">🔍 Bill padh rahe hain… <b id="ocrP">0%</b><br><span class="muted">Pehli baar thoda time lagega</span></div>';
    await loadTesseract();
    const big = imgToData(img, 1700, 0.92, true);
    const {data} = await Tesseract.recognize(big, 'eng', {logger: m => { if (m.status === 'recognizing text') { const p = $('#ocrP'); if (p) p.textContent = Math.round(m.progress * 100) + '%'; } }});
    applyOcr(parseReceipt(data.text || ''));
  } catch (e) {
    console.error(e);
    if (st) st.innerHTML = '<div class="ocr bad">Bill auto-read nahi hua — amount khud daal do. Photo save ho jayegi 👍</div>';
  }
}
function parseReceipt(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const numRe = /\d[\d,]*(?:\.\d{1,2})?/g;
  const lastNum = l => { const m = l.match(numRe); return m ? parseFloat(m[m.length - 1].replace(/,/g, '')) : null; };
  const totRe = /(grand\s*total|net\s*(amt|amount|payable|total|value)|total\s*(amt|amount|payable|rs|inr)?|amount\s*(payable|due|paid)|to\s*pay|bill\s*amount|net\s*bill)/i;
  const notTot = /(qty|quantity|items?\b|saving|saved|discount|sub\s*total|mrp)/i;
  const skip = /(gst|cgst|sgst|igst|tax|round|change|tender|phone|mob|tel|gstin|fssai|invoice|bill\s*no|date|time|cashier|counter|thank|www|http|upi|card|visa|balance)/i;
  const cands = [];
  lines.forEach(l => { if (totRe.test(l) && !notTot.test(l)) { const n = lastNum(l); if (n && n < 500000) cands.push(n); } });
  const items = [];
  lines.forEach(l => {
    if (totRe.test(l) || skip.test(l)) return;
    const m = l.match(/^(.*?[a-zA-Z]{3,}.*?)\s+[^a-zA-Z]*?(\d[\d,]*\.\d{1,2}|\d{1,5})\s*$/);
    if (m) {
      const name = m[1].replace(/[^a-zA-Z0-9 &\/-]/g, ' ').replace(/\s+/g, ' ').trim();
      const price = parseFloat(m[2].replace(/,/g, ''));
      if (name.length >= 3 && price > 0 && price < 100000) items.push({name, price, sub: shopType(name)});
    }
  });
  let total = cands.length ? Math.max(...cands) : null;
  if (!total && items.length) total = Math.round(items.reduce((a, b) => a + b.price, 0) * 100) / 100;
  const store = storeType(lines.slice(0, 6).join(' '));
  // jin items ka type pata nahi, unhe dukaan ka type do
  if (store) items.forEach(i => { if (i.sub === 'Other Shopping') i.sub = store; });
  const merchant = (lines.slice(0, 4).find(l => /[a-zA-Z]{4,}/.test(l) && !skip.test(l)) || '').replace(/[^a-zA-Z0-9 &.-]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
  return {total, items, cat: mainType(items) || store || null, merchant};
}
function mainType(items) {
  const g = groupItems(items); const e = Object.entries(g).filter(([k]) => k !== 'Other Shopping').sort((a, b) => b[1].amt - a[1].amt);
  return e.length ? e[0][0] : (items.length ? 'Other Shopping' : null);
}
function applyOcr(r) {
  const st = $('#ocrStat'); if (!st) return;
  if (r.total && !$('#eAmt').value) $('#eAmt').value = r.total;
  if (r.cat && !DRAFT.lockCat) setCat(r.cat);
  if (r.merchant && !$('#eNote').value) $('#eNote').value = r.merchant;
  DRAFT.items = r.items; $('#itemsBox').innerHTML = itemsHTML(r.items);
  const types = Object.keys(groupItems(r.items));
  st.innerHTML = r.total || r.items.length
    ? `<div class="ocr good">✅ ${r.total ? 'Total ' + inr(r.total) + ' mila' : 'Items mile'}${r.items.length ? ' · ' + r.items.length + ' items' : ''}${types.length ? ' · ' + types.join(', ') : ''}<br><span style="opacity:.8">Neeche har item ki category check kar lo, galat ho to badal do</span></div>`
    : '<div class="ocr bad">Photo saaf nahi padh paaye — amount khud daal do. Photo save rahegi.</div>';
}
function setCat(c) { $('#eCat').value = c; $('#emiBox').style.display = 'none'; if (!DRAFT.accTouched) $('#eAcc').value = defaultAcc(c); }
function groupItems(items) { const g = {}; (items || []).forEach(i => { g[i.sub] = g[i.sub] || {n: 0, amt: 0}; g[i.sub].n++; g[i.sub].amt += num(i.price); }); return g; }
function itemsHTML(items) {
  if (!items || !items.length) return '';
  const g = groupItems(items);
  return `<label>Bill ke items — category-wise</label><div class="items">${Object.entries(g).sort((a, b) => b[1].amt - a[1].amt).map(([k, v]) => `<div class="g"><span>${catIcon(k)} ${k} <span class="muted">(${v.n})</span></span><b>${inr(Math.round(v.amt))}</b></div>`).join('')}
  <details style="margin-top:6px"><summary class="muted">Har item ki category badlo</summary>${items.map((i, n) => `<div class="g" style="gap:6px;align-items:center"><span style="flex:1;min-width:0">${esc(i.name)} · <b>${inr(i.price)}</b></span><select style="width:auto;padding:4px 6px;font-size:12px;border-radius:8px" onchange="setItemType(${n},this.value)">${SHOP_CATS.map(c => `<option ${c === i.sub ? 'selected' : ''}>${c}</option>`).join('')}</select></div>`).join('')}</details></div>`;
}
function setItemType(n, v) {
  DRAFT.items[n].sub = v;
  const open = document.querySelector('#itemsBox details')?.open;
  $('#itemsBox').innerHTML = itemsHTML(DRAFT.items);
  if (open) document.querySelector('#itemsBox details').open = true;

function loanInfo(l) {
  const pays = loanPays(l);
  const done = num(l.paidBefore) + pays.length;
  const total = num(l.tenure);
  const left = total ? Math.max(0, total - done) : null;
  const monthPaid = sum(pays.filter(t => ymOf(t.date) === S.ym));
  const ok = monthPaid >= num(l.emi) && num(l.emi) > 0;
  const isCur = S.ym === today().slice(0, 7);
  const overdue = !ok && isCur && l.dueDay && Number(today().slice(8)) > num(l.dueDay);
  const endYM = left !== null ? shiftYM(today().slice(0, 7), left - (ok ? 0 : 1)) : null;
  const active = left === null || left > 0;
  return {pays, done, total, left, monthPaid, ok, overdue, endYM, active, outstanding: left !== null ? left * num(l.emi) : null};
}

const INV_KIND = {
  fd:  {icon:'🏦', short:'FD',  name:'Fixed Deposit',       amtLabel:'Jama amount (ek baar)'},
  rd:  {icon:'🔁', short:'RD',  name:'Recurring Deposit',   amtLabel:'Har mahine ki kisht'},
  sip: {icon:'📈', short:'SIP', name:'SIP (Mutual Fund)',   amtLabel:'Har mahine ka SIP'}
};
const monthsOf = y => Math.max(1, Math.round(num(y) * 12));
const addMonths = (d, m) => { const x = parseD(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + m); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return toISO(x); };
const monthsBetween = (a, b) => Math.max(0, diffDays(a, b) / 30.4375);
function invCalc(k, amt, rate, years) {
  const P = num(amt), r = num(rate) / 100, n = monthsOf(years);
  let invested, maturity;
  if (k === 'fd') { invested = P; maturity = P * Math.pow(1 + r / 4, 4 * n / 12); }          // quarterly compounding (bank FD)
  else if (k === 'rd') { invested = P * n; maturity = 0; for (let m = n; m >= 1; m--) maturity += P * Math.pow(1 + r / 4, m / 3); } // RD: quarterly compounding
  else { const i = r / 12; invested = P * n; maturity = i ? P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i) : invested; }            // SIP: monthly
  return {invested: Math.round(invested), maturity: Math.round(maturity), interest: Math.round(maturity - invested), months: n};
}
const invPays = v => DB.txns.filter(t => t.type === 'saving' && t.investId === v.id && t.mode !== 'withdraw');
function invInfo(v) {
  const c = invCalc(v.kind, v.amount, v.rate, v.years);
  const matDate = addMonths(v.start, c.months);
  const pays = invPays(v);
  const paidAmt = sum(pays) + (v.kind === 'fd' ? 0 : num(v.paidBefore) * num(v.amount));
  const paidCount = v.kind === 'fd' ? (pays.length ? 1 : 0) : pays.length + num(v.paidBefore);
  const r = num(v.rate) / 100, now = today() < matDate ? today() : matDate;
  let value;
  if (v.kind === 'fd') value = paidAmt ? paidAmt * Math.pow(1 + r / 4, 4 * monthsBetween(v.start, now) / 12) : 0;

    const rows = pays.map(t => [num(t.amount), t.date]);
    for (let j = 0; j < num(v.paidBefore); j++) rows.push([num(v.amount), addMonths(v.start, j)]);
    value = rows.reduce((a, [amt, d]) => { const m = monthsBetween(d, now); return a + amt * (v.kind === 'rd' ? Math.pow(1 + r / 4, m / 3) : Math.pow(1 + r / 12, m)); }, 0);
  }
  const monthDone = v.kind !== 'fd' && pays.some(t => ymOf(t.date) === S.ym);

  const matured = today() >= matDate;
  return {...c, matDate, paidAmt, paidCount, value: Math.round(value), monthDone, inTerm, matured, daysLeft: diffDays(today(), matDate)};
}

function vReports() {

  const contrib = rel.filter(t => t.type === 'contribution');
  const cM = sum(contrib.filter(t => t.person === 'minal')), cP = sum(contrib.filter(t => t.person === 'piyush'));
  const savT = rel.filter(t => t.type === 'saving').reduce((a, t) => a + (t.mode === 'withdraw' ? -num(t.amount) : num(t.amount)), 0);
  const unw = sum(exp.filter(t => t.tag === 'unwanted'));

  // category

  const catE = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  // daily

  const daily = days.map(d => sum(exp.filter(t => t.date === d)));

  // accounts table

const attOf = (mid, ym) => Store.get('attendance', mid + '_' + ym) || {days: {}};
function salaryFor(m, ym) {
  const h = (m.salaryHistory || []).filter(x => x.from <= ym).sort((a, b) => a.from.localeCompare(b.from));
  return h.length ? num(h[h.length - 1].salary) : num(m.salary);
}
function salaryChangeIn(m, ym) { return (m.salaryHistory || []).find(x => x.from === ym); }
function maidCalc(m, ym) {
  const att = attOf(m.id, ym); const d = att.days || {};
  const vals = Object.values(d);
  const P = vals.filter(v => v === 'P').length, A = vals.filter(v => v === 'A').length, H = vals.filter(v => v === 'H').length;
  const allowed = m.leaves === undefined || m.leaves === '' ? 2 : num(m.leaves);
  const excess = Math.max(0, A - allowed);
  const base = salaryFor(m, ym);
  const perDay = base / daysInYM(ym);
  const autoCut = Math.round(excess * perDay);
  const waived = !!att.waive;
  const deduction = waived ? 0 : autoCut;
  const extras = DB.extras.filter(e => e.maidId === m.id && ymOf(e.date) === ym);
  const extraSal = sum(extras.filter(e => !e.paidSeparately), 'charge');
  const extraSep = sum(extras.filter(e => e.paidSeparately), 'charge');
  const net = Math.max(0, base - deduction + extraSal);
  const pays = DB.salaries.filter(s => s.maidId === m.id && s.ym === ym);
  const paid = sum(pays);
  const marked = P + A + H;
  const wd = m.workDays && m.workDays.length ? m.workDays.map(Number) : [0,1,2,3,4,5,6];
  const curYM = today().slice(0, 7), [yy, mm] = ym.split('-').map(Number);
  const lastDay = ym < curYM ? daysInYM(ym) : ym === curYM ? Number(today().slice(8)) : 0;
  const unmarked = [];
  for (let dd = 1; dd <= lastDay; dd++) { const k = pad(dd), dow = (new Date(yy, mm - 1, dd).getDay() + 6) % 7; if (wd.includes(dow) && !d[k]) unmarked.push(k); }
  const ready = marked > 0;
  return {P, A, H, allowed, excess, base, perDay, autoCut, waived, deduction, extras, extraSal, extraSep, net: ready ? net : 0, pays, paid, due: ready ? Math.max(0, net - paid) : 0, marked, unmarked, ready, inProgress: ym === curYM};
}

/* =========================================================
   MAID — PICK & DROP (2 ladies, 4 trips / din)
   ========================================================= */
const PD_TRIPS = ['10:00 AM · Ghar → Office', '1:00 PM · Office → Ghar', '3:00 PM · Ghar → Office', '6:00 PM · Office → Ghar'];
const PD_OLD = ['Subah drop', 'Dopahar pick-up', 'Dopahar drop', 'Shaam pick-up'];
const pdCfg = () => settings().pd || {};
const pdName = (c, l) => (c[l]?.name || (l === 'l1' ? 'Lady 1' : 'Lady 2'));
const pdTrips = c => (c.trips && c.trips.length && c.trips.join('|') !== PD_OLD.join('|') ? c.trips : PD_TRIPS);
const pdHead = t => { const [a, b] = t.split(' · '); return b ? `${esc(a.replace(':00', ''))}<br>${esc(b.replace('Office', 'Off.'))}` : esc(t.split(' ').slice(-1)[0]); };
const PD_CLR = {l1: 'var(--magenta)', l2: 'var(--purple)', x: 'var(--bad)', off: 'var(--muted)'};
function pdDays(ym) { return (attOf('pd', ym).days) || {}; }
function pdCalc(ym) {
  const c = pdCfg(), days = pdDays(ym), n = pdTrips(c).length;
  const cnt = {l1: 0, l2: 0, x: 0, off: 0};
  Object.values(days).forEach(arr => (arr || []).slice(0, n).forEach(v => { if (v in cnt) cnt[v]++; }));
  const done = cnt.l1 + cnt.l2;
  const amt = l => c.mode === 'monthly' ? (done ? Math.round(num(c.monthly) * cnt[l] / done) : 0) : Math.round(cnt[l] * num(c.rate));
  const out = {cnt, done};
  ['l1', 'l2'].forEach(l => {
    const pays = DB.pdPays.filter(x => x.ym === ym && x.lady === l);
    const paidSal = pays.reduce((a, x) => a + num(x.salaryPart ?? x.amount), 0);
    out[l] = {trips: cnt[l], amount: amt(l), pays, paid: paidSal, due: Math.max(0, amt(l) - paidSal)};
  });
  return out;
}
function vPD() {
  const c = pdCfg();
  if (!c.l1?.name) return `<div class="card" style="text-align:center"><div style="font-size:40px">🚸</div><h3 style="justify-content:center">Pick & Drop setup karo</h3>
    <p class="muted">Dono ladies ke naam, din ki trips aur payment ka tareeka</p><button class="btn" onclick="openPdCfg()">Setup karo</button></div>`;
  const ym = S.ym, trips = pdTrips(c), days = pdDays(ym), k = pdCalc(ym);
  const isCur = ym === today().slice(0, 7), tk = today().slice(8), tArr = days[tk] || [];
  const n = daysInYM(ym), [y, mo] = ym.split('-').map(Number);
  const lastDay = ym < today().slice(0, 7) ? n : isCur ? Number(tk) : 0;
  const cell = (v, d, i) => `<button onclick="pdCycle('${d}',${i})" style="width:100%;height:30px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:600;background:${v === 'l1' ? 'var(--pink)' : v === 'l2' ? 'var(--lav)' : v === 'x' ? 'var(--badbg)' : '#fff'};color:${PD_CLR[v] || 'var(--muted)'}">${v === 'l1' || v === 'l2' ? esc(pdName(c, v).slice(0, 4)) : v === 'x' ? '✘' : v === 'off' ? '—' : ''}</button>`;
  let rows = '';
  for (let d = n; d >= 1; d--) {
    const kk = pad(d), arr = days[kk] || [];
    if (d > lastDay && !arr.some(Boolean)) continue;
    const dow = WEEK[(new Date(y, mo - 1, d).getDay() + 6) % 7];
    rows += `<tr><td style="white-space:nowrap"><b>${d}</b> <span class="muted">${dow}</span></td>${trips.map((_, i) => `<td>${cell(arr[i] || '', kk, i)}</td>`).join('')}</tr>`;
  }

async function savePdCfg() {

  if (mode === 'trip' && rate <= 0) return toast('Per trip rate daalo'); if (mode === 'monthly' && monthly <= 0) return toast('Mahine ka amount daalo');
  await Store.update('meta', 'settings', {pd: {l1: {name: n1, phone: $('#pd1p').value.trim()}, l2: {name: n2, phone: $('#pd2p').value.trim()}, trips: [0, 1, 2, 3].map(i => $('#pdt' + i).value.trim() || PD_TRIPS[i]), mode, rate, monthly}});

async function pdWrite(ym, dk, fn) {
  const days = {...pdDays(ym)}; const arr = [...(days[dk] || [])]; while (arr.length < 4) arr.push('');
  fn(arr); days[dk] = arr;
  await Store.update('attendance', 'pd_' + ym, {maidId: 'pd', ym, days});
}
async function pdSet(dk, i, v) {
  const ym = today().slice(0, 7), cur = (pdDays(ym)[dk] || [])[i] || '';
  if (cur && cur !== v && !canEdit()) return toast('Mark ki hui trip sirf Minal badal sakti hai');
  await pdWrite(ym, dk, a => a[i] = cur === v ? '' : v);
}
async function pdAll(dk, v) {
  const ym = today().slice(0, 7), cur = pdDays(ym)[dk] || [];
  if (cur.some(Boolean) && !canEdit()) return toast('Sirf Minal badal sakti hai');

async function pdCycle(dk, i) {

async function unlinkPdPay(pid) {

function pdExtraTick(id, checked) {
  const e = Store.get('pdExtras', id); if (!e) return;
  if (checked) {
    modal(mHead('✔ Extra trip paid') + `
      <div class="stat" style="margin-bottom:6px"><div class="v">${inr(e.charge)}</div><div class="k">${esc(e.reason || 'Extra trip')} · ${esc(pdName(pdCfg(), e.lady))} · ${fmtDs(e.date)}</div></div>

    document.querySelector('.sheet .x').addEventListener('click', render);

async function payPdExtra(id) {

const BILL_TYPES = [['WiFi','📶'],['Bijli','⚡'],['Mobile recharge','📱'],['DTH / TV','📺'],['Piped gas','🔥'],['Society maintenance','🏢'],['Pani','💧'],['OTT (Netflix etc)','🎬'],['Other','🧾']];
const billIcon = b => (BILL_TYPES.find(x => x[0] === b.type) || ['', '🧾'])[1];
const billPays = b => DB.txns.filter(t => t.type === 'expense' && t.billId === b.id).sort((x, y) => y.date.localeCompare(x.date));
function billInfo(b, ym) {
  const pays = billPays(b), td = today(), cur = td.slice(0, 7);
  if (b.cycle === 'days') {
    const last = pays[0]?.date || b.start || null;
    const next = last ? addDays(last, num(b.validity) || 28) : td;
    const left = diffDays(td, next);
    const monthPaid = pays.filter(t => ymOf(t.date) === ym);
    const st = left < 0 ? 'overdue' : left <= 5 ? 'soon' : 'ok';
    return {pays, monthPaid, next, left, st, last};
  }
  const monthPaid = pays.filter(t => ymOf(t.date) === ym);
  const dueDate = ym + '-' + pad(Math.min(num(b.dueDay) || 1, daysInYM(ym)));
  const paid = monthPaid.length > 0;
  const left = diffDays(td, dueDate);
  const st = paid ? 'paid' : ym < cur ? 'overdue' : ym > cur ? 'upcoming' : left < 0 ? 'overdue' : left <= 5 ? 'soon' : 'due';
  return {pays, monthPaid, next: dueDate, left, st};
}

const KID_TYPES = [['Day Care Fees','🧸 Day Care'],['School Fees','🏫 School Fees'],['Kids Party','🎉 Party / Birthday'],['Kids & School','🎒 Books, Uniform, Other']];
const FREQ = {monthly:'Har mahine', quarterly:'Har 3 mahine', half:'Har 6 mahine', yearly:'Saal me ek baar', once:'Ek baar'};
function feePeriodKey(freq, date) {
  const [y, m] = date.split('-').map(Number);
  if (freq === 'monthly') return `${y}-${m}`;
  if (freq === 'quarterly') return `${y}-Q${Math.ceil(m / 3)}`;
  if (freq === 'half') return `${y}-H${m <= 6 ? 1 : 2}`;
  if (freq === 'yearly') return `${y}`;
  return 'once';
}
function feeStatus(f) {
  const ref = S.ym + '-01';
  const k = feePeriodKey(f.freq, ref);
  const paid = DB.txns.filter(t => t.feeId === f.id && t.type === 'expense' && feePeriodKey(f.freq, t.date) === k);
  return {paid: sum(paid), ok: sum(paid) >= num(f.amount) && num(f.amount) > 0, list: paid};
}
function kidShopAmt(t) {
  if (!isShop(t)) return 0;
  const items = t.items || [];
  if (items.length) { const all = items.reduce((a, i) => a + num(i.price), 0); const k = items.filter(i => i.sub === 'Kids & Toys').reduce((a, i) => a + num(i.price), 0); return all ? Math.round(num(t.amount) * k / all) : 0; }
  return t.category === 'Kids & Toys' ? num(t.amount) : 0;
}

  const shopTot = shopM.reduce((a, t) => a + kidShopAmt(t), 0);
  const yShop = DB.txns.filter(t => t.date.slice(0, 4) === yr).reduce((a, t) => a + kidShopAmt(t), 0);
  const yTot = sum(DB.txns.filter(t => isHomeT(t) && t.source === 'kid' && t.date.slice(0, 4) === yr)) + yShop;
  const fees = [...DB.fees].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const byType = KID_TYPES.map(([c, l]) => [l, sum(list.filter(t => t.category === c))]).concat([['🧸 Saaman (diaper, milk powder…)', shopTot]]);
  return `<div class="qa" style="grid-template-columns:repeat(4,1fr)">
    ${KID_TYPES.map(([c, l]) => `<button onclick="openKid(null,'${c}')"><b>${l.split(' ')[0]}</b>${l.split(' ').slice(1).join(' ').replace(', Other', '')}</button>`).join('')}
  </div>
  ${pendingCard(t => t.source === 'kid')}
  ${monthNav()}
  <div class="sec-title">Fixed fees ${ymLabel(S.ym)} <button class="mini" onclick="openFee()">＋ Fee add</button></div>

function cylStats() {
  const recs = [...DB.cylinders].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const ch = recs.filter(r => r.changedOn).map(r => r.changedOn).sort();
  const durs = []; for (let i = 1; i < ch.length; i++) durs.push(diffDays(ch[i - 1], ch[i]));
  const avg = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;
  const lastChange = ch[ch.length - 1] || null;
  const running = lastChange ? diffDays(lastChange, today()) : null;
  const open = [...recs].reverse().find(r => !r.changedOn) || null;
  const lastBook = recs.map(r => r.bookedOn).filter(Boolean).sort().pop() || null;
  const lastDel = recs.map(r => r.deliveredOn).filter(Boolean).sort().pop() || null;
  const expEmpty = lastChange && avg ? addDays(lastChange, avg) : null;
  const bookBy = expEmpty ? addDays(expEmpty, -7) : null;
  return {recs, avg, lastChange, running, open, lastBook, lastDel, expEmpty, bookBy, durs};
}

  const g = {};
  list.forEach(t => {
    const items = t.items || [];
    if (items.length) { const itTot = items.reduce((a, i) => a + num(i.price), 0); const sc = itTot ? num(t.amount) / itTot : 1; items.forEach(i => g[i.sub] = (g[i.sub] || 0) + num(i.price) * sc); }
    else g[t.category] = (g[t.category] || 0) + num(t.amount);
  });
  return g;
}
function vShopping() {
  const all = DB.txns.filter(t => isShop(t) && ymOf(t.date) === S.ym);
  const g = shopSplit(all);
  const ge = Object.entries(g).sort((a, b) => b[1] - a[1]);
  const tot = sum(all);
  const prev = sum(DB.txns.filter(t => isShop(t) && ymOf(t.date) === shiftYM(S.ym, -1)));
  const f = S.shopF;
  const list = (f === 'all' ? all : all.filter(t => t.category === f || (t.items || []).some(i => i.sub === f)))
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const unw = sum(all.filter(t => t.tag === 'unwanted'));
  if (ge.length) chart('shSub', {type:'doughnut', data:{labels: ge.map(x => x[0]), datasets:[{data: ge.map(x => Math.round(x[1])), backgroundColor: PALETTE, borderWidth:2, borderColor:'#fff'}]}, options:{maintainAspectRatio:false, cutout:'55%', plugins:{legend:{position:'right', labels:{font:{size:10.5}}}}}});
  return `<button class="btn" style="margin:0 0 8px;padding:16px" onclick="openExpense({shop:true,scan:true})">📷 Bill ki photo lo — auto entry</button>
  <button class="btn ghost" style="margin:0 0 6px" onclick="openExpense({shop:true})">✍️ Bina photo ke entry</button>
  <div class="muted" style="margin:0 2px 12px">Entry "Baaki" rahegi — 💸 Paid dabane par hi Budget se minus hoga.</div>
  ${pendingCard(t => t.source === 'shop')}
  ${monthNav()}
  <div class="grid3" style="margin-bottom:12px">
    <div class="stat m"><div class="v">${inr(tot)}</div><div class="k">Is mahine shopping</div></div>
    <div class="stat"><div class="v">${inr(prev)}</div><div class="k">Pichle mahine ${prev ? (tot > prev ? '▲' : '▼') : ''}</div></div>
    <div class="stat bad"><div class="v">${inr(unw)}</div><div class="k">Unwanted</div></div>
  </div>
  ${ge.length ? `<div class="card"><h3>🧺 Kis cheez pe kitna</h3><div class="chartbox"><canvas id="shSub"></canvas></div>
    <table class="t" style="margin-top:8px">${ge.map(([c, v]) => `<tr><td>${catIcon(c)} ${c}</td><td class="r"><b>${inr(Math.round(v))}</b></td><td class="r muted">${tot ? Math.round(v / tot * 100) : 0}%</td></tr>`).join('')}</table></div>` : ''}
  <div class="filters"><button class="st ${f === 'all' ? 'on' : ''}" onclick="S.shopF='all';render()">Sab</button>${SHOP_CATS.map(c => `<button class="st ${f === c ? 'on' : ''}" onclick="S.shopF='${c}';render()">${catIcon(c)} ${c}</button>`).join('')}</div>
  <div class="card"><h3>Shopping bills <span>${list.length}</span></h3>${list.length ? list.map(t => txnRow(t)).join('') : '<div class="empty">Koi entry nahi</div>'}</div>`;
}

/* =========================================================
   SETTINGS
   ========================================================= */
function openSettings() {
  const pins = settings().pins || DEFAULT_PINS;
  modal(mHead('⚙️ Settings') + `
    <div class="card"><b>${USERS[USER].emoji} ${USERS[USER].name}</b> <span class="muted">· ${canEdit() ? 'Admin (edit/delete allowed)' : 'View + Add (edit/delete sirf Minal)'}</span><br>
    <span class="muted">${Store.mode === 'cloud' ? '☁️ Firebase sync ON — dono phones me same data' : '📱 Local mode — data sirf is browser me. Sync ke liye index.html me FIREBASE_CONFIG daalo.'}</span></div>
    ${canEdit() ? `<label>Minal ka PIN</label><input id="pinM" maxlength="4" inputmode="numeric" value="${esc(pins.minal)}">
    <label>Piyush ka PIN</label><input id="pinP" maxlength="4" inputmode="numeric" value="${esc(pins.piyush)}">
    <button class="btn" onclick="savePins()">PIN save karo</button>` : ''}
    <button class="btn ghost" onclick="exportJSON()">⬇️ Backup download (JSON)</button>
    ${canEdit() ? `<label class="btn cream" style="text-align:center;display:block;color:var(--plum);position:relative">⬆️ Backup restore<input type="file" accept=".json" style="position:absolute;inset:0;opacity:0" onchange="importJSON(this)"></label>` : ''}
    <button class="btn danger" onclick="logout()">Logout</button>`);
}
async function savePins() { const m = $('#pinM').value.trim(), p = $('#pinP').value.trim(); if (!/^\d{4}$/.test(m) || !/^\d{4}$/.test(p)) return toast('PIN 4 digit ka hona chahiye'); await Store.update('meta', 'settings', {pins: {minal: m, piyush: p}}); closeModal(); toast('PIN update ✔'); }
function exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(DB)], {type:'application/json'})); a.download = `GharKhata_backup_${today()}.json`; a.click(); }
function importJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!confirm('Backup restore karein? Same ID wali entries overwrite hongi.')) return;
      for (const c of COLS) for (const x of (d[c] || [])) { const {id, ...rest} = x; if (Store.mode === 'cloud') await fs.collection('gk_' + c).doc(id).set(clean(rest)); else { DB[c] = DB[c].filter(y => y.id !== id); DB[c].push(x); } }
      Store.persist(); closeModal(); render(); toast('Restore ho gaya ✔');
    } catch (e) { toast('File sahi nahi hai'); }
  };
  r.readAsText(f);
}

/* ---------- boot ---------- */
(async function boot() {
  $('#app').innerHTML = '<div class="login"><h1>Ghar Khata</h1><p>Load ho raha hai…</p></div>';
  await Store.init();
  if (USER) await seed();
  render();
})();
</script>
